name: YVTVRemote
options:
  bundleIdPrefix: com.aistudio.yvtvremote
  deploymentTarget:
    iOS: "16.0"
packages:
  SwiftProtobuf:
    url: https://github.com/apple/swiftprotobuf.git
    from: "1.28.0"
targets:
  YVTVRemote:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: YVTVRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aistudio.yvtvremote.ios
        PRODUCT_NAME: YV-TV Remote
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: YVTVRemote/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: SwiftProtobuf
        product: SwiftProtobuf
