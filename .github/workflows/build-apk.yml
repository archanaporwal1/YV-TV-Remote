name: Build & Publish Smart TV Remote APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare & Verify Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          PASS="${KEYSTORE_PASSWORD:-TvRemotePermanent2026}"
          ALIAS="${KEY_ALIAS:-tvremote}"
          KEYPASS="${KEY_PASSWORD:-$PASS}"

          VALID=false
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > my-upload-key.jks 2>/dev/null || true
            if [ -s my-upload-key.jks ] && keytool -list -keystore my-upload-key.jks -storepass "$PASS" >/dev/null 2>&1; then
              echo "Verified valid keystore from KEYSTORE_BASE64 secret."
              VALID=true
            else
              echo "KEYSTORE_BASE64 was empty or corrupted. Regenerating a valid keystore..."
              rm -f my-upload-key.jks
            fi
          fi

          if [ "$VALID" = false ]; then
            keytool -genkeypair -noprompt \
              -keystore my-upload-key.jks \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -alias "$ALIAS" \
              -storepass "$PASS" \
              -keypass "$KEYPASS" \
              -dname "CN=SmartTVRemote, OU=Mobile, O=App, L=Hyderabad, S=Telangana, C=IN"

            echo "=================================================================="
            echo "COPY THIS CLEAN SINGLE-LINE KEYSTORE_BASE64 TO GITHUB SECRETS ONCE:"
            base64 -w 0 my-upload-key.jks
            echo ""
            echo "=================================================================="
          fi

      - name: Build Unsigned Release APK
        run: |
          sed -i 's/signingConfig = signingConfigs.getByName("release")//g' app/build.gradle.kts || true
          sed -i 's/signingConfig signingConfigs.release//g' app/build.gradle.kts || true
          sed -i 's/signingConfig signingConfigs.getByName("release")//g' app/build.gradle.kts || true
          gradle assembleRelease

      - name: Zipalign & Sign Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          PASS="${KEYSTORE_PASSWORD:-TvRemotePermanent2026}"
          ALIAS="${KEY_ALIAS:-tvremote}"
          KEYPASS="${KEY_PASSWORD:-$PASS}"

          DETECTED_ALIAS=$(keytool -list -keystore my-upload-key.jks -storepass "$PASS" | grep "PrivateKeyEntry" | cut -d',' -f1 | head -n 1)
          FINAL_ALIAS="${DETECTED_ALIAS:-$ALIAS}"

          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 | sort -V | tail -n 1)
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)

          $BUILD_TOOLS/zipalign -v -p 4 "$UNSIGNED_APK" aligned.apk
          $BUILD_TOOLS/apksigner sign \
            --ks my-upload-key.jks \
            --ks-pass pass:"$PASS" \
            --ks-key-alias "$FINAL_ALIAS" \
            --key-pass pass:"$KEYPASS" \
            --out YV-TV-Remote-v${{ github.run_number }}.apk \
            aligned.apk

          $BUILD_TOOLS/apksigner verify --verbose YV-TV-Remote-v${{ github.run_number }}.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: YV TV Remote v1.0.${{ github.run_number }}
          body: "Automated signed release build #${{ github.run_number }}"
          files: YV-TV-Remote-v${{ github.run_number }}.apk
