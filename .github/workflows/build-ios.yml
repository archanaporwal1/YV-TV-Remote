name: Build iOS Smart TV Remote

on:
  push:
    branches: [ main, master ]
    paths:
      - 'ios/**'
      - 'app/src/main/proto/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen & SwiftProtobuf
        run: brew install xcodegen protobuf swift-protobuf

      - name: Generate Swift Protobuf Models
        run: |
          mkdir -p ios/YVTVRemote/Proto
          protoc \
            --proto_path=app/src/main/proto \
            --swift_out=ios/YVTVRemote/Proto \
            app/src/main/proto/pairing.proto \
            app/src/main/proto/remotemessage.proto

      - name: Generate Xcode Project
        working-directory: ios
        run: xcodegen generate

      - name: Build Unsigned iOS Release App
        working-directory: ios
        run: |
          xcodebuild \
            -project YVTVRemote.xcodeproj \
            -scheme YVTVRemote \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package Unsigned IPA for Sideloading
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/"YV-TV Remote.app" Payload/
          zip -qry ../YV-TV-Remote-iOS-unsigned.ipa Payload

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YV-TV-Remote-iOS-IPA
          path: YV-TV-Remote-iOS-unsigned.ipa
          retention-days: 30
