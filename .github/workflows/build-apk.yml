name: Build & Sign Smart TV Remote APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Keystore at Root (my-upload-key.jks)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          PASS="${KEYSTORE_PASSWORD:-TvRemotePermanent2026}"
          ALIAS="${KEY_ALIAS:-tvremote}"
          KEYPASS="${KEY_PASSWORD:-$PASS}"

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Generating permanent 100-year keystore at my-upload-key.jks..."
            keytool -genkeypair -noprompt \
              -keystore my-upload-key.jks \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -alias "$ALIAS" \
              -storepass "$PASS" \
              -keypass "$KEYPASS" \
              -dname "CN=SmartTVRemote, OU=Mobile, O=App, L=Hyderabad, S=Telangana, C=IN"

            echo "=================================================================="
            echo "COPY THIS KEYSTORE_BASE64 STRING INTO GITHUB SECRETS ONCE:"
            base64 -w 0 my-upload-key.jks
            echo ""
            echo "=================================================================="
          else
            echo "Decoding saved KEYSTORE_BASE64 into my-upload-key.jks..."
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          fi

      - name: Build Signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Upload Signed APK & Keystore Backup
        uses: actions/upload-artifact@v4
        with:
          name: YV-TV-Remote-Signed-APK
          path: |
            app/build/outputs/apk/release/*.apk
            my-upload-key.jks
