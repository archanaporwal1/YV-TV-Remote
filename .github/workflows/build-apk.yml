name: Build & Publish Smart TV Remote APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare & Verify Permanent Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          PASS="${KEYSTORE_PASSWORD:-TvRemotePermanent2026}"
          ALIAS="${KEY_ALIAS:-tvremote}"
          KEYPASS="${KEY_PASSWORD:-$PASS}"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > my-upload-key.jks 2>/dev/null || true
          fi
          if [ -s my-upload-key.jks ] && keytool -list -keystore my-upload-key.jks -storepass "$PASS" >/dev/null 2>&1; then
            echo "Verified permanent keystore from GitHub Secrets."
          else
            rm -f my-upload-key.jks
            keytool -genkeypair -noprompt -keystore my-upload-key.jks -keyalg RSA -keysize 2048 -validity 36500 \
              -alias "$ALIAS" -storepass "$PASS" -keypass "$KEYPASS" \
              -dname "CN=SmartTVRemote, OU=Mobile, O=App, L=Hyderabad, S=Telangana, C=IN"
            echo "COPY THIS SINGLE LINE INTO KEYSTORE_BASE64 SECRET:"
            base64 -w 0 my-upload-key.jks
          fi

      - name: Resolve Version Metadata
        id: meta
        run: |
          BASE_VER=$(grep -E '^[[:space:]]*versionName[[:space:]]*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || true)
          if [ -z "$BASE_VER" ] || [[ "$BASE_VER" == *"="* ]]; then
            BASE_VER=$(grep -E 'val ciVersionName' -A1 app/build.gradle.kts | grep -oE '"[^"]+"' | tail -n 1 | tr -d '"' || true)
          fi
          BASE_VER=${BASE_VER:-1.0}
          DOT_COUNT=$(echo "$BASE_VER" | tr -cd '.' | wc -c)
          if [ "$DOT_COUNT" -ge 2 ]; then FINAL_VER="$BASE_VER"; else FINAL_VER="${BASE_VER}.${{ github.run_number }}"; fi
          GRADLE_CODE=$(grep -E '^[[:space:]]*versionCode[[:space:]]*=' app/build.gradle.kts | head -n 1 | grep -oE '[0-9]+' || true)
          GRADLE_CODE=${GRADLE_CODE:-1}
          if [ "$GRADLE_CODE" -gt "${{ github.run_number }}" ]; then FINAL_CODE="$GRADLE_CODE"; else FINAL_CODE="${{ github.run_number }}"; fi
          echo "version_name=$FINAL_VER" >> $GITHUB_OUTPUT
          echo "version_code=$FINAL_CODE" >> $GITHUB_OUTPUT
                - name: Inject In-App Downloader & Auto-Update Popup
        env:
          REPO: ${{ github.repository }}
        run: |
          python3 - << 'EOF'
          import os, re, glob
          repo = os.environ["REPO"]
          mp = "app/src/main/AndroidManifest.xml"
          if os.path.exists(mp):
              t = open(mp).read()
              for p in ["INTERNET", "REQUEST_INSTALL_PACKAGES"]:
                  if p not in t: t = t.replace("<application", f'<uses-permission android:name="android.permission.{p}" />\n    <application', 1)
              if "auto_updater_paths" not in t:
                  t = t.replace("</application>", '<provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.autoupdater.provider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/auto_updater_paths" /></provider>\n    </application>', 1)
              open(mp, "w").write(t)
          os.makedirs("app/src/main/res/xml", exist_ok=True)
          open("app/src/main/res/xml/auto_updater_paths.xml", "w").write('<paths><cache-path name="updates" path="." /></paths>')
          files = glob.glob("app/src/main/**/MainActivity.kt", recursive=True) + glob.glob("app/src/main/**/MainActivity.java", recursive=True)
          if not files: exit(0)
          tf = files.pop(0); src = open(tf).read()
          pm = re.search(r'^\s*(package\s+[^\r\n;]+)', src, re.M)
          pkg = pm.group(1).strip() if pm else "package com.tvremote.app"
          kt = f'''{pkg}
          import android.app.*; import android.content.*; import android.net.Uri; import android.os.*; import android.provider.Settings
          import androidx.core.content.FileProvider; import org.json.JSONObject; import java.io.File; import java.net.*; import kotlin.concurrent.thread
          object AutoAppUpdater {{
            private var done = false
            @JvmStatic fun checkForUpdate(c: Context) {{
              if (done) return; done = true
              thread {{ try {{
                val j = JSONObject(URL("https://github.com{repo}/releases/latest/download/update-manifest.json").readText())
                val lc = j.getInt("versionCode"); val ln = j.getString("versionName"); val apk = j.getString("apkUrl")
                val pi = c.packageManager.getPackageInfo(c.packageName, 0)
                val cc = if (Build.VERSION.SDK_INT >= 28) pi.longVersionCode.toInt() else @Suppress("DEPRECATION") pi.versionCode
                if (lc > cc) Handler(Looper.getMainLooper()).post {{
                  AlertDialog.Builder(c).setTitle("Update Available (v$ln)").setMessage("Install v$ln inside the app now?")
                    .setPositiveButton("Update Now") {{ _, _ -> dl(c, apk) }}.setNegativeButton("Later", null).show()
                }}
              }} catch (_: Exception) {{}} }}
            }}
            private fun dl(c: Context, u: String) {{
              if (Build.VERSION.SDK_INT >= 26 && !c.packageManager.canRequestPackageInstalls()) {{
                c.startActivity(Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES, Uri.parse("package:${{c.packageName}}"))); return
              }}
              @Suppress("DEPRECATION") val d = ProgressDialog(c).apply {{ setTitle("Downloading Update..."); setProgressStyle(ProgressDialog.STYLE_HORIZONTAL); max = 100; setCancelable(false); show() }}
              thread {{ try {{
                val cn = (URL(u).openConnection() as HttpURLConnection).apply {{ instanceFollowRedirects = true }}
                val tot = cn.contentLength; val f = File(c.cacheDir, "upd.apk")
                cn.inputStream.use {{ i -> f.outputStream().use {{ o -> val b = ByteArray(8192); var dl = 0; var r: Int
                  while (i.read(b).also {{ r = it }} != -1) {{ o.write(b, 0, r); dl += r; if (tot > 0) Handler(Looper.getMainLooper()).post {{ d.progress = ((dl * 100L) / tot).toInt() }} }}
                }} }}
                Handler(Looper.getMainLooper()).post {{ d.dismiss(); val uri = FileProvider.getUriForFile(c, "${{c.packageName}}.autoupdater.provider", f)
                  c.startActivity(Intent(Intent.ACTION_VIEW).apply {{ setDataAndType(uri, "application/vnd.android.package-archive"); addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK) }}) }}
              }} catch (_: Exception) {{ Handler(Looper.getMainLooper()).post {{ d.dismiss() }} }} }}
            }}
          }}'''
          open(os.path.join(os.path.dirname(tf), "AutoAppUpdater.kt"), "w").write("\n".join(l[10:] if l.startswith("          ") else l for l in kt.splitlines()))
          if "AutoAppUpdater.checkForUpdate" not in src:
              rep = r'\1\n        AutoAppUpdater.checkForUpdate(this)' if tf.endswith(".kt") else r'\1\n        AutoAppUpdater.checkForUpdate(this);'
              s2, n = re.subn(r'(super\.onCreate\([^\)]*\);?)', rep, src, count=1)
              if n > 0: open(tf, "w").write(s2)
          EOF

      - name: Build, Sign & Publish Release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          REPO: ${{ github.repository }}
        run: |
          sed -i 's/signingConfig = signingConfigs.getByName("release")//g' app/build.gradle.kts || true
          sed -i 's/signingConfig signingConfigs.release//g' app/build.gradle.kts || true
          sed -i 's/signingConfig signingConfigs.getByName("release")//g' app/build.gradle.kts || true
          printf 'allprojects { plugins.withId("com.android.application") { android { defaultConfig { versionCode = project.property("APP_VERSION_CODE").toString().toInteger(); versionName = project.property("APP_VERSION_NAME").toString() } } } }\n' > ci-version.init.gradle
          gradle assembleRelease --init-script ci-version.init.gradle -PAPP_VERSION_CODE=${{ steps.meta.outputs.version_code }} -PAPP_VERSION_NAME=${{ steps.meta.outputs.version_name }} -PRELEASE_REPO=$REPO
          PASS="${KEYSTORE_PASSWORD:-TvRemotePermanent2026}"; ALIAS="${KEY_ALIAS:-tvremote}"; KEYPASS="${KEY_PASSWORD:-$PASS}"
          FINAL_ALIAS=$(keytool -list -keystore my-upload-key.jks -storepass "$PASS" | grep "PrivateKeyEntry" | cut -d',' -f1 | head -n 1)
          FINAL_ALIAS="${FINAL_ALIAS:-$ALIAS}"
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -maxdepth 1 | sort -V | tail -n 1)
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          VER_NAME="${{ steps.meta.outputs.version_name }}"; VER_CODE="${{ steps.meta.outputs.version_code }}"
          APK_FILE="YV-TV-Remote-v${VER_NAME}.apk"
          $BUILD_TOOLS/zipalign -v -p 4 "$UNSIGNED_APK" aligned.apk
          $BUILD_TOOLS/apksigner sign --ks my-upload-key.jks --ks-pass pass:"$PASS" --ks-key-alias "$FINAL_ALIAS" --key-pass pass:"$KEYPASS" --out "$APK_FILE" aligned.apk
          RELEASE_NOTES=$(git log -1 --pretty=%s || echo "Automated release")
          VER_CODE="$VER_CODE" VER_NAME="$VER_NAME" APK_FILE="$APK_FILE" REPO="$REPO" RELEASE_NOTES="$RELEASE_NOTES" python3 -c 'import json, os; open("update-manifest.json", "w").write(json.dumps({"versionCode": int(os.environ["VER_CODE"]), "versionName": os.environ["VER_NAME"], "tag": "v" + os.environ["VER_NAME"], "title": "YV TV Remote v" + os.environ["VER_NAME"], "notes": os.environ["RELEASE_NOTES"], "apkUrl": "https://github.com" + os.environ["REPO"] + "/releases/download/v" + os.environ["VER_NAME"] + "/" + os.environ["APK_FILE"], "releaseUrl": "https://github.com" + os.environ["REPO"] + "/releases/tag/v" + os.environ["VER_NAME"]}, indent=2))'

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version_name }}
          name: YV TV Remote v${{ steps.meta.outputs.version_name }}
          body: "Automated signed release v${{ steps.meta.outputs.version_name }} (Build #${{ steps.meta.outputs.version_code }})"
          files: |
            YV-TV-Remote-v${{ steps.meta.outputs.version_name }}.apk
            update-manifest.json
