name: Build & Publish Smart TV Remote APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Keystore at Root (my-upload-key.jks)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          PASS="${KEYSTORE_PASSWORD:-TvRemotePermanent2026}"
          ALIAS="${KEY_ALIAS:-upload}"
          KEYPASS="${KEY_PASSWORD:-$PASS}"

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Generating permanent 100-year keystore at my-upload-key.jks..."
            keytool -genkeypair -noprompt \
              -keystore my-upload-key.jks \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -alias "$ALIAS" \
              -storepass "$PASS" \
              -keypass "$KEYPASS" \
              -dname "CN=SmartTVRemote, OU=Mobile, O=App, L=Hyderabad, S=Telangana, C=IN"

            echo "=================================================================="
            echo "COPY THIS KEYSTORE_BASE64 STRING INTO GITHUB SECRETS ONCE:"
            base64 -w 0 my-upload-key.jks
            echo ""
            echo "=================================================================="
          else
            echo "Decoding saved KEYSTORE_BASE64 into my-upload-key.jks..."
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          fi

      - name: Build Signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          PASS="${KEYSTORE_PASSWORD:-TvRemotePermanent2026}"
          ALIAS="${KEY_ALIAS:-upload}"
          KEYPASS="${KEY_PASSWORD:-$PASS}"

          export STORE_PASSWORD="$PASS"
          export KEY_PASSWORD="$KEYPASS"
          export KEYSTORE_PATH="$(pwd)/my-upload-key.jks"

          gradle assembleRelease \
            -PstorePassword="$PASS" \
            -PkeyAlias="$ALIAS" \
            -PkeyPassword="$KEYPASS" \
            -PKEYSTORE_PASSWORD="$PASS" \
            -PKEY_ALIAS="$ALIAS" \
            -PKEY_PASSWORD="$KEYPASS" \
            -Pandroid.injected.signing.store.file="$(pwd)/my-upload-key.jks" \
            -Pandroid.injected.signing.store.password="$PASS" \
            -Pandroid.injected.signing.key.alias="$ALIAS" \
            -Pandroid.injected.signing.key.password="$KEYPASS"

      - name: Rename APK for Clean Download
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$APK_FILE" YV-TV-Remote-v${{ github.run_number }}.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: YV TV Remote v1.0.${{ github.run_number }}
          body: "Automated signed release build #${{ github.run_number }}"
          files: YV-TV-Remote-v${{ github.run_number }}.apk
